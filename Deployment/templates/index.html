<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Language Recognition</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222;line-height:1.5}
  main{max-width:520px;margin:56px auto;padding:0 16px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:#666;margin:0 0 28px}
  .drop{position:relative;display:flex;align-items:center;justify-content:center;min-height:220px;padding:16px;border:2px dashed #ccc;border-radius:12px;text-align:center;color:#777;transition:border-color .2s}
  .drop:hover,.drop:focus-within{border-color:#2563eb}
  .drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
  .drop img{max-width:100%;max-height:260px;border-radius:8px}
  button{width:100%;margin-top:16px;padding:12px;font:inherit;font-weight:600;color:#fff;background:#2563eb;border:0;border-radius:8px;cursor:pointer;transition:background .2s}
  button:hover{background:#1d4ed8}
  button:disabled{background:#a5b4fc;cursor:default}
  .error{color:#c0392b;margin:12px 0 0}
  .result{margin-top:32px;text-align:center}
  .letter{font-size:96px;font-weight:600;line-height:1}
  .score{color:#444;margin-top:8px}
  .others{color:#777;font-size:14px}
  footer{margin-top:48px;color:#999;font-size:13px;text-align:center}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Sign Language Recognition</h1>
  <p class="sub">Upload a photo of a hand sign and the model will guess the letter.</p>

  <label class="drop">
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp" aria-label="Choose a hand sign image">
    <span id="hint">Click or drop an image here<br><small>PNG, JPG or WEBP, up to 8 MB</small></span>
    <img id="preview" alt="Selected hand sign" hidden>
  </label>

  <button id="predict" disabled>Recognize</button>
  <p id="error" class="error" role="alert" hidden></p>

  <section id="result" class="result" aria-live="polite" hidden>
    <div class="letter" id="letter"></div>
    <div class="score" id="score"></div>
    <div class="others" id="others"></div>
  </section>

  <footer>Class project · TensorFlow + Flask · Letters A–Y, except J (J and Z need motion)</footer>
</main>

<script>
const $ = id => document.getElementById(id);
const fileInput = $('file'), button = $('predict'), preview = $('preview');
let selected = null;

function showError(message) {
  $('error').textContent = message;
  $('error').hidden = !message;
}

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return showError('Choose a PNG, JPG or WEBP image.');
  if (file.size > 8 * 1024 * 1024) return showError('Keep your image under 8 MB.');
  selected = file;
  showError('');
  if (preview.src) URL.revokeObjectURL(preview.src);
  preview.src = URL.createObjectURL(file);
  preview.hidden = false;
  $('hint').hidden = true;
  $('result').hidden = true;
  button.disabled = false;
});

button.addEventListener('click', async () => {
  if (!selected) return;
  button.disabled = true;
  button.textContent = 'Recognizing…';
  showError('');
  const data = new FormData();
  data.append('image', selected);
  try {
    const response = await fetch('/predict', {method: 'POST', body: data});
    const json = await response.json();
    if (!response.ok) throw new Error(json.error || 'Prediction failed. Try again.');
    const [top, ...rest] = json.predictions;
    $('letter').textContent = top.letter;
    $('score').textContent = `${top.score}% model score`;
    $('others').textContent = rest.length ? 'Other guesses: ' + rest.map(p => `${p.letter} (${p.score}%)`).join(', ') : '';
    $('result').hidden = false;
  } catch (e) {
    showError(e.name === 'Error' ? e.message : 'Could not reach the server. Is it running?');
  } finally {
    button.disabled = false;
    button.textContent = 'Recognize';
  }
});
</script>
</body>
</html>
